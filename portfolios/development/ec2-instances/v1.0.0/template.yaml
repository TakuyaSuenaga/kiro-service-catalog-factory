AWSTemplateFormatVersion: '2010-09-09'
Description: 'Ubuntu 24.04 ARM EC2 instance with SSM management capabilities - Provides a secure, managed EC2 instance for development workloads'

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "EC2 Instance Configuration"
        Parameters:
          - InstanceType
          - KeyPairName
          - InstanceName
      - Label:
          default: "Network Configuration"
        Parameters:
          - VpcId
          - SubnetId
          - AssignPublicIP
      - Label:
          default: "Security Configuration"
        Parameters:
          - AllowedSSHCidr
          - EnableSSMOnly
      - Label:
          default: "Storage Configuration"
        Parameters:
          - VolumeSize
          - VolumeType
    ParameterLabels:
      InstanceType:
        default: "Instance Type"
      KeyPairName:
        default: "Key Pair Name"
      InstanceName:
        default: "Instance Name"
      SubnetId:
        default: "Subnet ID"
      VpcId:
        default: "VPC ID"
      AssignPublicIP:
        default: "Assign Public IP"
      AllowedSSHCidr:
        default: "Allowed SSH CIDR"
      EnableSSMOnly:
        default: "SSM Only Access"
      VolumeSize:
        default: "Root Volume Size (GB)"
      VolumeType:
        default: "Root Volume Type"
  
  AWS::CloudFormation::Designer:
    ApplicationName: "Ubuntu 24.04 ARM EC2 Instance"
    ApplicationVersion: "1.0.0"
    
  Author: "Infrastructure Team"
  Version: "1.0.0"
  LastUpdated: "2024-01-01"
  Purpose: "Development environment EC2 instance with SSM management"

Parameters:
  InstanceType:
    Type: String
    Default: t4g.micro
    AllowedValues:
      - t4g.nano
      - t4g.micro
      - t4g.small
      - t4g.medium
      - t4g.large
      - t4g.xlarge
      - m6g.medium
      - m6g.large
      - m6g.xlarge
      - m6g.2xlarge
      - c6g.medium
      - c6g.large
      - c6g.xlarge
    Description: EC2 instance type (ARM-based instances only). Choose based on your workload requirements.
    
  KeyPairName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: Name of an existing EC2 KeyPair to enable SSH access to the instance
    
  InstanceName:
    Type: String
    Default: Ubuntu-Dev-Instance
    Description: Name tag for the EC2 instance
    MinLength: 1
    MaxLength: 255
    AllowedPattern: ^[a-zA-Z0-9\-_]+$
    ConstraintDescription: Must contain only alphanumeric characters, hyphens, and underscores
    
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Subnet ID where the instance will be launched. Choose a public subnet if you need internet access.
    
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC ID where the security group will be created
    
  AssignPublicIP:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    Description: Whether to assign a public IP address to the instance
    
  AllowedSSHCidr:
    Type: String
    Default: 10.0.0.0/8
    Description: CIDR block allowed to SSH to the instance. Use 0.0.0.0/0 for any IP (not recommended for production)
    AllowedPattern: ^([0-9]{1,3}\.){3}[0-9]{1,3}/[0-9]{1,2}$
    ConstraintDescription: Must be a valid CIDR notation (e.g., 10.0.0.0/8)
    
  EnableSSMOnly:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: If true, SSH access will be disabled and only SSM Session Manager will be available
    
  VolumeSize:
    Type: Number
    Default: 20
    MinValue: 8
    MaxValue: 1000
    Description: Size of the root EBS volume in GB
    
  VolumeType:
    Type: String
    Default: gp3
    AllowedValues:
      - gp2
      - gp3
      - io1
      - io2
    Description: EBS volume type for the root volume

Mappings:
  RegionMap:
    us-east-1:
      Ubuntu2404ARM: ami-0c2a1acae6667e438
    us-west-2:
      Ubuntu2404ARM: ami-0c38b837cd80f13bb
    eu-west-1:
      Ubuntu2404ARM: ami-0c9c942bd7bf113a2
    ap-northeast-1:
      Ubuntu2404ARM: ami-0c94d2bfd0b7bb8b4
    # Add more regions as needed

Resources:
  # IAM Role for SSM
  EC2SSMRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-SSM-Role"

  # Instance Profile for the IAM Role
  EC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref EC2SSMRole

  # Security Group
  EC2SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "Security group for ${InstanceName} - Ubuntu 24.04 ARM EC2 instance"
      VpcId: !Ref VpcId
      SecurityGroupIngress: !If
        - EnableSSHAccess
        - - IpProtocol: tcp
            FromPort: 22
            ToPort: 22
            CidrIp: !Ref AllowedSSHCidr
            Description: SSH access
        - !Ref AWS::NoValue
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: All outbound traffic
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-SecurityGroup"
        - Key: Purpose
          Value: "Ubuntu EC2 Instance Security Group"

  # EC2 Instance
  EC2Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !FindInMap [RegionMap, !Ref 'AWS::Region', Ubuntu2404ARM]
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyPairName
      SubnetId: !Ref SubnetId
      SecurityGroupIds:
        - !Ref EC2SecurityGroup
      IamInstanceProfile: !Ref EC2InstanceProfile
      AssociatePublicIpAddress: !Ref AssignPublicIP
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: !Ref VolumeSize
            VolumeType: !Ref VolumeType
            DeleteOnTermination: true
            Encrypted: true
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          apt-get update
          apt-get install -y awscli curl wget htop
          
          # Install CloudFormation helper scripts
          apt-get install -y python3-pip
          pip3 install https://s3.amazonaws.com/cloudformation-examples/aws-cfn-bootstrap-py3-latest.tar.gz
          
          # Install SSM Agent (should be pre-installed on Ubuntu 24.04, but ensure it's running)
          systemctl enable amazon-ssm-agent
          systemctl start amazon-ssm-agent
          
          # Create a welcome message
          echo "Welcome to Ubuntu 24.04 ARM EC2 Instance" > /etc/motd
          echo "Instance Name: ${InstanceName}" >> /etc/motd
          echo "Instance Type: ${InstanceType}" >> /etc/motd
          echo "SSM Managed: Yes" >> /etc/motd
          echo "Stack: ${AWS::StackName}" >> /etc/motd
          
          # Signal CloudFormation that the instance is ready
          /usr/local/bin/cfn-signal -e $? --stack ${AWS::StackName} --resource EC2Instance --region ${AWS::Region}
      Tags:
        - Key: Name
          Value: !Ref InstanceName
        - Key: OS
          Value: Ubuntu-24.04-ARM
        - Key: SSMManaged
          Value: "true"
        - Key: Environment
          Value: Development
        - Key: CreatedBy
          Value: CloudFormation
        - Key: Stack
          Value: !Ref AWS::StackName
    CreationPolicy:
      ResourceSignal:
        Timeout: PT15M
        Count: 1

Outputs:
  InstanceId:
    Description: Instance ID of the created EC2 instance
    Value: !Ref EC2Instance
    Export:
      Name: !Sub "${AWS::StackName}-InstanceId"
      
  InstanceName:
    Description: Name of the EC2 instance
    Value: !Ref InstanceName
    Export:
      Name: !Sub "${AWS::StackName}-InstanceName"
      
  PublicIpAddress:
    Description: Public IP address of the EC2 instance (if assigned)
    Value: !GetAtt EC2Instance.PublicIp
    Export:
      Name: !Sub "${AWS::StackName}-PublicIP"
    Condition: HasPublicIP
      
  PrivateIpAddress:
    Description: Private IP address of the EC2 instance
    Value: !GetAtt EC2Instance.PrivateIp
    Export:
      Name: !Sub "${AWS::StackName}-PrivateIP"
      
  PublicDnsName:
    Description: Public DNS name of the EC2 instance (if in public subnet)
    Value: !GetAtt EC2Instance.PublicDnsName
    Export:
      Name: !Sub "${AWS::StackName}-PublicDNS"
    Condition: HasPublicIP
      
  PrivateDnsName:
    Description: Private DNS name of the EC2 instance
    Value: !GetAtt EC2Instance.PrivateDnsName
    Export:
      Name: !Sub "${AWS::StackName}-PrivateDNS"
      
  SecurityGroupId:
    Description: Security Group ID attached to the instance
    Value: !Ref EC2SecurityGroup
    Export:
      Name: !Sub "${AWS::StackName}-SecurityGroupId"
      
  IAMRoleArn:
    Description: ARN of the IAM role attached to the instance
    Value: !GetAtt EC2SSMRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-IAMRoleArn"
      
  InstanceType:
    Description: Type of the EC2 instance
    Value: !Ref InstanceType
    Export:
      Name: !Sub "${AWS::StackName}-InstanceType"
      
  AvailabilityZone:
    Description: Availability Zone of the EC2 instance
    Value: !GetAtt EC2Instance.AvailabilityZone
    Export:
      Name: !Sub "${AWS::StackName}-AvailabilityZone"
      
  SSMSessionCommand:
    Description: AWS CLI command to start SSM session with this instance
    Value: !Sub "aws ssm start-session --target ${EC2Instance}"
    
  SSHCommand:
    Description: SSH command to connect to the instance (if SSH is enabled and public IP is assigned)
    Value: !Sub "ssh -i ~/.ssh/${KeyPairName}.pem ubuntu@${EC2Instance.PublicIp}"
    Condition: CanSSH
    
  InstanceConsoleURL:
    Description: URL to access the instance in AWS Console
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/ec2/v2/home?region=${AWS::Region}#InstanceDetails:instanceId=${EC2Instance}"

Conditions:
  HasPublicIP: !And
    - !Equals [!Ref AssignPublicIP, "true"]
    - !Not [!Equals [!GetAtt EC2Instance.PublicIp, ""]]
  EnableSSHAccess: !Equals [!Ref EnableSSMOnly, "false"]
  CanSSH: !And
    - !Condition HasPublicIP
    - !Condition EnableSSHAccess